name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
          - os: ubuntu-latest
            node: '18' # Engine-floor compatibility only, not a security-support promise.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Locked optional dependency installation (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Secret scan
        run: node scripts/security/secret-scan.mjs

      - name: Distribution tests
        run: node tests/distribution-update.test.mjs
        env:
          AGENT_OS_SKIP_FULL_REGRESSION: '1'

      - name: Distribution security tests
        run: node tests/distribution-security.test.mjs
        env:
          AGENT_OS_SKIP_FULL_REGRESSION: '1'

      - name: Core test suites
        # Explicit bash uses -e -o pipefail on every runner, including Windows.
        # A failed native command must not be masked by a later successful one.
        shell: bash
        run: |
          npm test
          npm run test:policy
          npm run test:bootstrap
          npm run test:adapter
          npm run test:runtime
          npm run test:plugin
          npm run test:intelligence
          npm run test:orchestration
          npm run test:deployment
          npm run test:neutrality
          npm run test:stage22
          npm run test:stage23
          npm run test:stage24
          npm run test:stage25
          npm run test:stage26
          npm run test:stage27
          npm run test:stage28

      - name: Release validation (no tag)
        run: node scripts/release/validate-release.mjs
        env:
          AGENT_OS_SKIP_FULL_REGRESSION: '1'

      - name: Clean INCLUDE-only source reproduction
        run: npm run validate:rc-source
