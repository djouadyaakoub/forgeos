schema_version: 1

contract:
  version: 1

# ForgeOS — Project Intelligence Contract template
# Location: .agent-os/project.yaml  (canonical persistence)
# See: docs/architecture/PROJECT-INTELLIGENCE-CONTRACT.md

forgeos:
  version: ">=2.0 <3.0"
  adapter_schema_version: 1

# Legacy alias (read-time compatible)
agent_os:
  version: ">=2.0 <3.0"
  adapter_schema_version: 1

project:
  id: my-project
  name: My Project
  type: application      # application | library | monorepo | infrastructure
  task_id_prefix: PROJ   # task IDs: PROJ-YYYYMMDD-NNN

# Optional DECLARED host preference, never execution approval:
# host:
#   preferred: codex

# DISCOVERED — stack signals; not ownership authority
stack:
  detected: []
  components: {}

paths:
  docs: docs/
  tasks: docs/project/tasks/

# DECLARED knowledge pointers — never silently promote to global ForgeOS knowledge
knowledge:
  stack: docs/STACK.md
  architecture: docs/architecture/
  contracts: docs/contracts/
  adr: docs/adr/
  tasks: docs/project/tasks/
  lessons: docs/runbooks/lessons/

# DECLARED — empty [] is a valid greenfield contract
capabilities: []

# AUTHORITATIVE mapping (object), not a list
agents: {}

# AUTHORITATIVE
ownership: []

policy:
  protected_paths: []
  tier3_operations: []   # additive to global Tier 3 baseline
  shell_rules: []
  mcp_rules: []

integrations:
  mcp: []

verification:
  commands: []

# Constraints for a future Runtime Router — does NOT select a backend
runtime:
  requirements: {}
